<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Линия книги — «Блуждающие значения»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&subset=cyrillic&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE6; --card:#FBF9F4; --ink:#24221F; --grey:#77736B; --hair:#E0DACD; --ghost:#BDB7AA;
    --c0:#7D7A73; --c1:#B05A3C; --c2:#4D6A86; --c3:#6F8058; --c4:#7A5470; --c5:#B8913F; --c6:#3F7C78; --cx:#BDB7AA;
    --accent:#B05A3C; --backdrop:rgba(36,34,31,.32);
    --panel-w:420px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--paper:#1B1A17; --card:#24221E; --ink:#ECE7DD; --grey:#A8A296; --hair:#3A3732; --ghost:#5E5A52; --c0:#A29E95; --c1:#D9805F; --c2:#86A6C4; --c3:#A3B585; --c4:#B48AA8; --c5:#D6B26A; --c6:#78ADA8; --cx:#5E5A52; --accent:#D9805F; --backdrop:rgba(0,0,0,.55);}
  }
  :root[data-theme="dark"]{--paper:#1B1A17; --card:#24221E; --ink:#ECE7DD; --grey:#A8A296; --hair:#3A3732; --ghost:#5E5A52; --c0:#A29E95; --c1:#D9805F; --c2:#86A6C4; --c3:#A3B585; --c4:#B48AA8; --c5:#D6B26A; --c6:#78ADA8; --cx:#5E5A52; --accent:#D9805F; --backdrop:rgba(0,0,0,.55);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:28px 40px 22px;border-bottom:3px solid var(--ink)}
  .line-bullet{width:58px;height:58px;border-radius:50%;background:var(--c1);color:#fff;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Literata',Georgia,serif;font-weight:700;font-size:26px}
  .title-block h1{font-family:'Literata',Georgia,serif;font-weight:700;font-size:clamp(20px,3.4vw,32px);letter-spacing:0;line-height:1.1}
  .title-block p{color:var(--grey);font-size:14px;margin-top:6px}
  .header-note{margin-left:auto;text-align:right;font-size:13px;color:var(--grey);border-left:2px solid var(--hair);padding-left:18px;line-height:1.5}
  .header-note b{color:var(--ink);font-weight:600}
  .legend{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:16px 40px;font-size:13px;color:var(--grey);border-bottom:1px solid var(--hair)}
  .legend .item{display:flex;align-items:center;gap:9px}
  .swatch{width:34px;height:6px;border-radius:3px;flex:0 0 auto}
  .swatch.dashed{background:repeating-linear-gradient(90deg,var(--ghost) 0 7px,transparent 7px 13px)}
  .dot-here{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,90,60,.45)}70%{box-shadow:0 0 0 11px rgba(176,90,60,0)}100%{box-shadow:0 0 0 0 rgba(176,90,60,0)}}
  .map-wrap{max-width:1240px;margin:0 auto;padding:10px 16px 0}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .st-name{font:600 14px 'IBM Plex Sans',sans-serif;fill:var(--ink)}
  .st-num{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--grey);letter-spacing:.08em}
  .st-ghost{font:italic 400 13px 'IBM Plex Sans',sans-serif;fill:var(--ghost)}
  .ch-label{font:700 12px 'Literata',Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
  .station{cursor:pointer;outline:none}
  .station circle.core{transition:r .15s ease}
  .station:hover circle.core,.station:focus-visible circle.core{r:13}
  .station:focus-visible circle.core{stroke-width:7}
  .station:hover .st-name{text-decoration:underline}
  .backdrop{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40}
  .backdrop.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;height:100%;width:var(--panel-w);max-width:92vw;background:var(--card);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-12px 0 40px rgba(22,24,29,.16)}
  .panel{visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s .28s}
  .panel.open{transform:translateX(0);visibility:visible;transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .panel-head{padding:26px 28px 20px;color:#fff;position:relative}
  .panel-head .num{font-family:'Literata',Georgia,serif;font-weight:700;font-size:12px;opacity:.88;letter-spacing:.12em;text-transform:uppercase;padding-right:40px}
  .panel-head h2{font-family:'Literata',Georgia,serif;font-weight:500;font-size:21px;line-height:1.25;margin-top:10px}
  .panel-head .meta{font-size:13px;opacity:.88;margin-top:10px}
  .close-btn{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;font-size:18px;line-height:1}
  .close-btn:hover{background:rgba(255,255,255,.32)}
  .close-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .panel-body{padding:22px 28px 32px;overflow-y:auto;flex:1}
  .panel-body p{font-size:14.5px;line-height:1.65;margin-bottom:13px}
  .open-page{display:inline-block;margin:4px 0 20px;font-size:13px;font-weight:600;text-decoration:none;border:1.5px solid var(--hair);border-radius:20px;padding:6px 14px}
  .open-page:hover{border-color:var(--ink)}
  .group{margin-top:16px}
  .group h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-decoration:none;padding:4px 11px 4px 4px;border-radius:20px;background:var(--paper);border:1px solid var(--hair)}
  .chip.noimg{padding-left:11px}
  .chip img{width:24px;height:24px;border-radius:50%;object-fit:cover}
  .chip:hover{border-color:var(--ink)}
  .empty{font-size:13px;color:var(--grey);font-style:italic}
  footer{padding:22px 40px 36px;font-size:13px;color:var(--grey);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a{color:var(--ink)}
  @media (max-width:720px){
    header{padding:22px 16px 18px}
    .header-note{display:none}
    .legend{padding:13px 16px;gap:14px}
    footer{padding:18px 16px 30px}
    .panel{top:auto;bottom:0;right:0;left:0;width:100%;max-width:none;height:auto;max-height:80vh;transform:translateY(105%);border-radius:18px 18px 0 0}
    .panel.open{transform:translateY(0)}
  }
  @media (prefers-reduced-motion:reduce){.dot-here{animation:none}.panel,.backdrop,.station circle.core{transition:none}}
</style>
</head>
<body>
<header>
  <div class="line-bullet" aria-hidden="true">У</div>
  <div class="title-block">
    <h1>Линия «Блуждающие значения»</h1>
    <p>Путеводитель по книге Марка Уилсона · главы — участки линии, разделы — станции · <a href="ATLAS_URL">атлас персоналий →</a></p>
  </div>
  <div class="header-note" id="header-note"></div>
</header>
<div class="legend" id="legend"></div>
<div class="map-wrap"><svg id="map" role="group" aria-label="Схема книги в виде линии метро. Нажмите на станцию, чтобы открыть аннотацию раздела и его карточки."></svg></div>
<footer>
  <span><a href="SITE_URL">← Путеводитель</a> · <a href="SITE_URL05-chapters/razdely/">все разделы</a> · <a href="ATLAS_URL">атлас персоналий →</a></span>
  <span>Нажмите на станцию, чтобы открыть раздел · данные собраны DATE_BUILT</span>
</footer>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true">
  <div class="panel-head" id="panel-head">
    <button class="close-btn" id="close-btn" aria-label="Закрыть">✕</button>
    <div class="num" id="panel-num"></div>
    <h2 id="panel-title"></h2>
    <div class="meta" id="panel-meta"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script>
const DATA = /*DATA*/null;
const KINDS = [['концепт','Понятия'],['метафора','Метафоры и образы'],['персоналия','Персоналии'],['пример-кейс','Примеры-кейсы'],['контекст','Контекст']];
const SVGNS = 'http://www.w3.org/2000/svg';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const color = ch => css('--c' + ch);
const stations = DATA.sections;
const here = stations.length - 1;
const chapters = DATA.chapters;

function el(tag, attrs, parent){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function wrap(text, max){
  const words = text.split(' '), lines = [''];
  for (const w of words){
    const cur = lines[lines.length-1];
    if ((cur + ' ' + w).trim().length > max && cur) lines.push(w); else lines[lines.length-1] = (cur + ' ' + w).trim();
  }
  if (lines.length > 2){ lines.length = 2; lines[1] = lines[1].replace(/\s*\S*$/, '') + '…'; }
  return lines;
}

function layout(width){
  const vertical = width < 720;
  if (vertical){
    const x = 34, step = 74, top = 40;
    return {vertical, w: width, h: top + step * stations.length + 90,
      pos: stations.map((s, i) => ({x, y: top + i * step, row: i}))};
  }
  const perRow = width < 1000 ? 5 : 6, padX = 150, rowH = 190, top = 110;
  const inner = Math.max(width, 900) - padX * 2;
  const dx = inner / (perRow - 1);
  const pos = stations.map((s, i) => {
    const row = Math.floor(i / perRow), k = i % perRow;
    const x = row % 2 === 0 ? padX + k * dx : padX + (perRow - 1 - k) * dx;
    return {x, y: top + row * rowH, row};
  });
  const rows = Math.ceil(stations.length / perRow);
  return {vertical, w: Math.max(width, 900), h: top + (rows - 1) * rowH + 110, pos, perRow, padX};
}

function draw(){
  const svg = document.getElementById('map');
  svg.innerHTML = '';
  const width = svg.parentElement.clientWidth - 32;
  const L = layout(width);
  svg.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
  const lines = el('g', {}, svg), ghosts = el('g', {}, svg), nodes = el('g', {}, svg);
  const r = 26;
  // перегоны
  for (let i = 0; i < stations.length - 1; i++){
    const a = L.pos[i], b = L.pos[i+1];
    let d;
    if (L.vertical || a.row === b.row) d = `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    else {
      const side = a.x > L.w / 2 ? 1 : -1, ex = a.x + side * (L.padX - 40);
      d = `M ${a.x} ${a.y} H ${ex - side*r} Q ${ex} ${a.y} ${ex} ${a.y + r} V ${b.y - r} Q ${ex} ${b.y} ${ex - side*r} ${b.y} H ${b.x}`;
    }
    el('path', {d, fill:'none', stroke: color(stations[i+1].chapter), 'stroke-width':10, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, lines);
  }
  // строящийся участок: главы без разделов
  const last = L.pos[here], todo = chapters.filter(c => !c.sections);
  if (todo.length){
    const label = 'гл. ' + todo[0].n + (todo.length > 1 ? '–' + todo[todo.length-1].n : '') + ' · строится';
    if (L.vertical){
      el('path', {d:`M ${last.x} ${last.y} V ${last.y + 70}`, fill:'none', stroke:css('--ghost'), 'stroke-width':6, 'stroke-linecap':'round', 'stroke-dasharray':'2 14'}, ghosts);
      const t = el('text', {class:'st-ghost', x:last.x + 26, y:last.y + 66}, ghosts); t.textContent = label;
    } else {
      const dir = (last.row % 2 === 0) ? 1 : -1;
      const x2 = Math.max(40, Math.min(L.w - 40, last.x + dir * 230));
      el('path', {d:`M ${last.x} ${last.y} H ${x2}`, fill:'none', stroke:css('--ghost'), 'stroke-width':6, 'stroke-linecap':'round', 'stroke-dasharray':'2 16'}, ghosts);
      const t = el('text', {class:'st-ghost', x:(last.x + x2) / 2, y:last.y - 22, 'text-anchor':'middle'}, ghosts); t.textContent = label;
    }
  }
  // станции
  stations.forEach((s, i) => {
    const p = L.pos[i], col = color(s.chapter);
    const first = i === 0 || stations[i-1].chapter !== s.chapter;
    const g = el('g', {class:'station', tabindex:0, role:'button', 'data-i':i,
      'aria-label': `${s.chapter ? 'Глава ' + s.chapter + ', раздел (' + s.section + ')' : 'Предисловие'}: ${s.title}. Карточек: ${s.cards.length}${i === here ? '. Вы здесь' : ''}`}, nodes);
    if (i === here){
      const pulse = el('circle', {cx:p.x, cy:p.y, r:13, fill:css('--accent'), opacity:.35}, g);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
        el('animate', {attributeName:'r', values:'13;26;13', dur:'2.2s', repeatCount:'indefinite'}, pulse);
        el('animate', {attributeName:'opacity', values:'.35;0;.35', dur:'2.2s', repeatCount:'indefinite'}, pulse);
      }
    }
    if (first) el('circle', {cx:p.x, cy:p.y, r:16, fill:css('--card'), stroke:col, 'stroke-width':3}, g);
    el('circle', {class:'core', cx:p.x, cy:p.y, r:10, fill:css('--card'), stroke:col, 'stroke-width':5}, g);
    if (i === here) el('circle', {cx:p.x, cy:p.y, r:4.5, fill:css('--accent')}, g);
    const num = !s.chapter ? 'ПРЕДИСЛОВИЕ' : (first && !L.vertical ? `ГЛАВА ${s.chapter} · (${s.section})` : `ГЛ. ${s.chapter} · (${s.section})`);
    const lines2 = s.chapter ? wrap(s.title, L.vertical ? 34 : 22) : [];
    if (L.vertical){
      const t0 = el('text', {class:'st-num', x:p.x + 30, y:p.y - 6}, g); t0.textContent = num + (i === here ? ' · ВЫ ЗДЕСЬ' : '');
      lines2.forEach((ln, k) => { const t = el('text', {class:'st-name', x:p.x + 30, y:p.y + 12 + k * 17}, g); t.textContent = ln; });
      if (first && s.chapter){ const c = el('text', {class:'ch-label', x:p.x + 30, y:p.y - 24, fill:col}, g); c.textContent = chapters[s.chapter - 1].short; }
    } else {
      const above = i % 2 === 0;
      const base = above ? p.y - 30 - (lines2.length - 1) * 17 : p.y + 36;
      lines2.forEach((ln, k) => { const t = el('text', {class:'st-name', x:p.x, y:base + k * 17, 'text-anchor':'middle'}, g); t.textContent = ln; });
      const ny = above ? base - 18 : base + lines2.length * 17 + (s.chapter ? 2 : 0);
      const t0 = el('text', {class:'st-num', x:p.x, y: s.chapter ? ny : p.y - 30, 'text-anchor':'middle'}, g);
      t0.textContent = num + (i === here ? ' · ВЫ ЗДЕСЬ' : '');
      if (first && s.chapter){ t0.setAttribute('fill', col); t0.style.fill = col; }
    }
    g.addEventListener('click', () => openStation(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openStation(i); } });
  });
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many);
}
function header(){
  const cards = new Set(stations.flatMap(s => s.cards));
  const h = stations[here];
  document.getElementById('header-note').innerHTML =
    `<b>${here} ${plural(here, 'станция', 'станции', 'станций')} позади</b><br>вы здесь — гл. ${h.chapter} (${h.section})<br>${cards.size} ${plural(cards.size, 'карточка', 'карточки', 'карточек')} на линии`;
  const lg = document.getElementById('legend');
  const items = [['0', 'Предисловие']].concat(chapters.filter(c => c.sections).map(c => [String(c.n), c.short]));
  lg.innerHTML = items.map(([n, t]) => `<div class="item"><span class="swatch" style="background:var(--c${n})"></span>${t}</div>`).join('') +
    '<div class="item"><span class="swatch dashed"></span>участок строится</div><div class="item"><span class="dot-here"></span>вы здесь</div>';
}

const panel = document.getElementById('panel'), backdrop = document.getElementById('backdrop');
let lastFocus = null;
function openStation(i){
  const s = stations[i];
  document.getElementById('panel-head').style.background = color(s.chapter);
  document.getElementById('panel-num').textContent = s.chapter ? `${chapters[s.chapter - 1].short} · раздел (${s.section})` : 'Предисловие';
  document.getElementById('panel-title').textContent = s.title;
  document.getElementById('panel-meta').textContent = `Карточек: ${s.cards.length}` + (i === here ? ' · вы здесь' : '');
  const body = document.getElementById('panel-body');
  body.innerHTML = '';
  for (const para of (s.annotation || '').split(/(?<=\.)\s+(?=[А-ЯA-Z«])/).reduce((acc, sent) => {
      if (!acc.length || acc[acc.length-1].length > 320) acc.push(sent); else acc[acc.length-1] += ' ' + sent; return acc; }, [])){
    const p = document.createElement('p'); p.textContent = para; body.appendChild(p);
  }
  const open = document.createElement('a'); open.className = 'open-page'; open.href = s.url; open.textContent = 'Открыть страницу раздела →';
  body.appendChild(open);
  const cards = s.cards.map(id => DATA.cards[id]).filter(Boolean);
  if (!cards.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Карточек пока нет.'; body.appendChild(e); }
  for (const [kind, label] of KINDS){
    const list = cards.filter(c => c.kind === kind).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    if (!list.length) continue;
    const g = document.createElement('div'); g.className = 'group';
    const h = document.createElement('h3'); h.textContent = `${label} · ${list.length}`; g.appendChild(h);
    const chips = document.createElement('div'); chips.className = 'chips';
    for (const c of list){
      const a = document.createElement('a'); a.className = 'chip' + (c.portrait ? '' : ' noimg'); a.href = c.url;
      if (c.portrait){ const im = document.createElement('img'); im.src = c.portrait; im.alt = ''; im.loading = 'lazy'; im.onerror = () => { im.remove(); a.classList.add('noimg'); }; a.appendChild(im); }
      a.appendChild(document.createTextNode(c.title)); chips.appendChild(a);
    }
    g.appendChild(chips); body.appendChild(g);
  }
  body.scrollTop = 0;
  lastFocus = document.activeElement;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); backdrop.classList.add('open');
  history.replaceState(null, '', '#' + s.id);
  document.getElementById('close-btn').focus();
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); backdrop.classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
  if (lastFocus) lastFocus.focus();
}
document.getElementById('close-btn').addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });

header(); draw();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
const fromHash = stations.findIndex(s => '#' + s.id === location.hash);
if (fromHash >= 0) openStation(fromHash);
</script>
</body>
</html>
