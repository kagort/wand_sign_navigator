<style>
  :root{
    --paper:#F7F7F4; --card:#FFFFFF; --ink:#16181D; --grey:#6E7076; --hair:#DDDDD6; --ghost:#B9BAB2;
    --c0:#6E7076; --c1:#D6203C; --c2:#0070B8; --c3:#8E2D9C; --c4:#0B8A5F; --c5:#D9822B; --c6:#2E7D9A;

      --c0:#9A9CA2; --c1:#FF4D63; --c2:#3FA3E8; --c3:#C06BD0; --backdrop:rgba(0,0,0,.55);

  :root[data-theme="dark"]{
    --paper:#15171B; --card:#1E2026; --ink:#ECEDEA; --grey:#A3A5AB; --hair:#33363D; --ghost:#55585F;
    --c0:#9A9CA2; --c1:#FF4D63; --c2:#3FA3E8; --c3:#C06BD0; --backdrop:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:28px 40px 22px;border-bottom:3px solid var(--ink)}
  .line-bullet{width:58px;height:58px;border-radius:50%;background:var(--c1);color:#fff;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:26px}
  .title-block h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(20px,3.4vw,32px);letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
  .title-block p{color:var(--grey);font-size:14px;margin-top:6px}

  .dot-here{width:12px;height:12px;border-radius:50%;background:var(--c1);animation:pulse 2s infinite;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,32,60,.45)}70%{box-shadow:0 0 0 11px rgba(214,32,60,0)}100%{box-shadow:0 0 0 0 rgba(214,32,60,0)}}
  .map-wrap{max-width:1240px;margin:0 auto;padding:10px 16px 0}
  svg{display:block;width:100%;height:auto;overflow:visible}

  .backdrop{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40}
  .backdrop.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;height:100%;width:var(--panel-w);max-width:92vw;background:var(--card);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-12px 0 40px rgba(22,24,29,.16)}
  .panel{visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s .28s}

  .panel-head{padding:26px 28px 20px;color:#fff;position:relative}
  .panel-head .num{font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;opacity:.88;letter-spacing:.12em;text-transform:uppercase;padding-right:40px}
  .panel-head h2{font-family:'Unbounded',sans-serif;font-weight:500;font-size:21px;line-height:1.25;margin-top:10px}

  .close-btn{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;font-size:18px;line-height:1}
  .close-btn:hover{background:rgba(255,255,255,.32)}

  .panel-body{padding:22px 28px 32px;overflow-y:auto;flex:1}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-decoration:none;padding:4px 11px 4px 4px;border-radius:20px;background:var(--paper);border:1px solid var(--hair)}
  .chip.noimg{padding-left:11px}

  footer a{color:var(--ink)}
  @media (max-width:720px){
    header{padding:22px 16px 18px}

    .panel.open{transform:translateY(0)}
  }
  @media (prefers-reduced-motion:reduce){.dot-here{animation:none}.panel,.backdrop,.station circle.core{transition:none}}

<script>
const DATA = {"sections": [{"id": "predislovie", "chapter": 0, "section": "", "title": "Предисловие", "annotation": "Автор представляет фигуры и линии влияния, задавшие замысел книги: практиков и инженеров, чьи наблюдения о концептуальной неоднозначности вдохновили общий тезис, и философскую генеалогию, между полюсами которой выстраивается собственная позиция.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/predislovie", "cards": ["anthony-of-padua", "charles-marks", "franz-reuleaux", "hilary-putnam", "jacques-hadamard", "oliver-heaviside", "p-j-nahin", "thomas-reid", "willard-quine", "gete-arhetipy-vitgenshteyna", "harvard-context", "uilson-fiddle-music"]}, {"id": "chapter_1_i", "chapter": 1, "section": "i", "title": "Введение в наши темы", "annotation": "Глава открывается калипсо-эпиграфом и сразу вводит центральную тему книги — статус концепций, понятий, свойств, атрибутов и родственных им категорий. Автор поднимает вопрос, почему эта проблематика заслужила репутацию скучной, и на конкретном примере (казус с коробочкой, где предлагается посчитать «the») показывает разницу между содержательным философским вопросом и его плохой, немотивированной подачей — задавая тем самым собственный метод изложения на контрасте с этой традицией. Автор предлагает изучать такие понятия, как «концепция» «свойство» как часть обыденного словаря, которым люди оценивают чужое и своё понимание. Ставится вопрос, на каком основании подобные оценки вообще правомочны. Уилсон отвергает наивное доверие любым претензиям на «концептуальный авторитет».", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_i", "cards": ["tip-token", "duke-of-iron", "roaring-lion", "korobochka-s-the"]}, {"id": "chapter_1_ii", "chapter": 1, "section": "ii", "title": "Классическая картина концепций", "annotation": "Отталкиваясь от разбора знаменитого пассажа Фреге о «третьей сфере» существования концепций, автор формулирует то, что называет «классической картиной концепций», — оптимистичный взгляд аналитической традиции, согласно которому концептуальное содержание в принципе чётко и поддаётся объективному прояснению через ясное мышление.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_ii", "cards": ["klassicheskaya-kartina-kontseptsiy", "problemy-filosofii-1912", "terminy-kontseptualnoy-otsenki", "bertrand-russell", "gottlob-frege", "robert-ingersoll"]}, {"id": "chapter_1_iii", "chapter": 1, "section": "iii", "title": "Концептуальная оценка", "annotation": "Уилсон объясняет, почему книга всё-таки опирается на «классическую картину», хотя её сегодня мало кто разделяет: подобно упрощённой, но долго работавшей ньютоновской модели света, она была «достаточно близка к истине» для практических целей. Подлинная причина странного поведения обычных понятий содержится в фундаментальном нежелании физического мира «стоять смирно», пока мы его описываем.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_iii", "cards": ["klassicheskaya-kartina-kontseptsiy", "gambit-skvoznoy-termin", "isaac-newton", "james-thomson", "ludwig-wittgenstein", "nyuton-issledovaniya-sveta"]}, {"id": "chapter_1_iv", "chapter": 1, "section": "iv", "title": "Науку нужно использовать, а не упоминать", "annotation": "Уилсон предостерегает против того, чтобы силой втискивать живое многообразие конкретных концептуальных оценок в общие абстрактные схемы. Автор в этом же духе отвергает жёсткое разделение труда между философией и остальными науками. Раздел завершается техническими оговорками о собственной нотации автора.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_iv", "cards": ["chuvstvitelnost-k-kontekstu", "yazyk-urii-gipa", "charles-lamb", "john-dewey", "t-h-huxley", "thomas-browne", "religio-medici-tsitata"]}, {"id": "chapter_1_v", "chapter": 1, "section": "v", "title": "Ur-философские течения", "annotation": "Уилсон объясняет, почему отказывается от стандартного философского требования сперва разгромить все конкурирующие доктрины: труднейшие проблемы философской традиции незаметно перетекают в область классически понимаемых концепций. Разобраться в них можно только вернувшись к истокам «ur-философии» — тем некритично воспринятым допущениям обыденного мышления, что заставляют нас переоценивать надёжность собственных понятий. В этом он прямо солидаризируется с Дж. Остином , который в «Sense and Sensibilia» так же скептически разбирал доктрину sense data и предостерегал против «Gleichshaltung» — поклонения аккуратным на вид дихотомиям.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_v", "cards": ["metafora-morskogo-puteshestviya", "j-l-austin", "sense-and-sensibilia"]}, {"id": "chapter_1_vi", "chapter": 1, "section": "vi", "title": "Семантическая завершённость", "annotation": "Уилсон вводит понятие «семантической завершённости» — расхожего допущения, что носители языка достигают полного владения базовыми понятиями уже к 10–11 годам, после чего это содержание остаётся неизменным. На развёрнутом примере слова «радуга» (зачатого в детском заблуждении об «арке», но благополучно адаптировавшегося к взрослому употреблению) он показывает, что это допущение ложно: содержание понятий продолжает подстраиваться под контекст далеко за пределами детства.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_vi", "cards": ["doctor-seuss", "jean-piaget", "leonhard-euler", "ray-jackendoff"]}, {"id": "chapter_1_vii", "chapter": 1, "section": "vii", "title": "Уроки прикладной математики", "annotation": "Причина, по которой понятия ведут себя странно связаны с устройством самой Вселенной. Физически простые системы требуют неожиданных обходных стратегий для их описания, чему прикладная математика учит куда лучше кабинетной философии. Опираясь на образ о корабле, который приходится чинить в открытом море, Уилсон обещает подойти к задаче как к «лингвистической инженерии» — с терпением к тому, что понимание собственных языковых механизмов может прийти лишь спустя годы после их успешного применения. В этом фрагменте Уилсон оттачивает лексическую сочетаемость термина \"семантический\". Здесь уже есть \"семантическая наивность\", \"семантическое озарение\", \"семантическое терпение\" наравне с \"семантической завершенностью\".", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_vii", "cards": ["gambit-skvoznoy-termin", "korabl-noyrata", "metafora-morskogo-puteshestviya", "obhodnye-strategii-dom-nauki", "otto-neurath"]}, {"id": "chapter_1_viii", "chapter": 1, "section": "viii", "title": "Зачем изучать концепции?", "annotation": "Уилсон формулирует замысел книги как «двигатель мысли Рассела, включённый задним ходом». Основная идея - сформулировать те же самые проблемы концептуального управления, что и у классической традиции с переносом проблем прикладной математики ( см. \"о неизбежном расхождении между светлой надеждой и благосклонной реальностью\") в сферу обыденного языка", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_viii", "cards": ["david-lewis", "michael-dummett", "robert-brandom"]}, {"id": "chapter_1_ix", "chapter": 1, "section": "ix", "title": "Смягченный скептицизм", "annotation": "Автор пытается занять умеренную позицию, дистанцируясь от догматического классицизма и от «диких» анти-классических крайностей (Т. Кун, постструктурализм). Уилсон иллюстрирует свой через притчу о Друидах (два альтернативных сценария именования самолёта — «птица» и «дом»), которая показывает концепция становится следствием задним числом сконструированной иллюзия, которая в свою очередь порождена случайной историей столкновения с новым объектом. Далее идёт набор избыточных цитат и метафор: цитата Юма о «причудливом состоянии человечества», строки Хилэра Беллока («держись медсестры»), метафора Витгенштейна о языке как старом городе с пристройками разных эпох, и собственная геологическая метафора Уилсона о «поликристаллическом» строении значения слова (зёрна-карманы локального словоупотребления, эпитаксиальный рост новых значений на границах старых значений). Явный пример авторской неудержимости и метафорического перебора.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_ix", "cards": ["gambit-skvoznoy-termin", "david-hume", "heinrich-hertz", "hermann-helmholtz", "hilaire-belloc", "ludwig-wittgenstein", "untamed-women"]}, {"id": "chapter_1_x", "chapter": 1, "section": "x", "title": "Преувеличенные опасения", "annotation": "Уилсон разбирает скептический парадокс Крипке/Витгенштейна о следовании правилу как малопродуктивную альтернативу своему кейсу с Друидами. Попутно автор противопоставляет простую арифметику сложному случаю возведения в комплексную степень. Упомянутый юмовский пирронизм порождает новую сеть морских метафор (корабль Пирса, проблема долготы), которая явно предвосхищает название главы 4 — «Strange Latitudes». Здесь явно предвосхищаются такие названия подразделов как \"Странные широты\", \"Атласы и фасады.\"", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_x", "cards": ["gambit-skvoznoy-termin"]}, {"id": "chapter_1_xi", "chapter": 1, "section": "xi", "title": "Наши перспективы", "annotation": "Уилсон поясняет свой метод, указывая на бесплодность попыток определить «концепт» вообще). Также он предостерегает от смешения концептов с объективными свойствами. Завершается первая глава характеристикой «классического списка» как эффектного, но пустого каркаса. Это список похож на альпийский курорт из комических новелл, который превращается в фарс, как только пытаешься реально «заселить номера».", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_1/chapter_1_xi", "cards": ["william-hazlitt", "all-hat-no-cattle", "alpiyskiy-kurort-komiksy"]}, {"id": "chapter_2_i", "chapter": 2, "section": "i", "title": "Манящая муза ur-философии", "annotation": "Уилсон открывает главу 2 сценой прослушивания моцартовской Симфонии №40, чтобы поставить вопрос: должна ли «постоянность» великого произведения объясняться через некий устойчивый атрибут, и что происходит, когда разные слушатели (или разные эпохи) воспринимают одну и ту же музыку принципиально по-разному — вплоть до полной слепоты к её эмоциональному содержанию.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_i", "cards": ["richard-vagner", "volker-scherliess", "wolfgang-amadeus-mozart", "oklahoma-hoedown-primer", "simfoniya-40-mozart", "skripichnaya-muzyka-vostochnogo-kentukki"]}, {"id": "chapter_2_ii", "chapter": 2, "section": "ii", "title": "Объективный экстремизм", "annotation": "Вкусы с годами меняются. Можно ли говорить тогда о незыблемости канонов в искусстве? Уилсон разбирает случай морализирующего критика, упрекавшего Дарвина в утрате «музыкального чувства». Представление о музыкальном содержании как о чём-то прямо данном восприятию - ложная картина, т.к. эстетической чувствительность обусловлена множеством факторов. В подтверждение автор привлекает автобиографическое признание самого Дарвина и наблюдение Джеймса о неконтролируемой изменчивости вкуса с возрастом. Для Уилсона важно, что техасская скрипичная музыки утратила свой эмоциональный контур под напором джазовой гармонии. Не все могут расслышать печаль в скрипичных партиях.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_ii", "cards": ["charles-darwin", "william-james", "teksasskaya-skripichnaya-muzyka"]}, {"id": "chapter_2_iii", "chapter": 2, "section": "iii", "title": "Тропосферное самодовольство", "annotation": "Уилсон вводит понятие «тропосферного самодовольства» — врождённой склонности проецировать привычный земной опыт на всю вселенную — и иллюстрирует его на примере химии воды (клатратгидраты, gauche- и cis-формации льда, фазы льда под давлением), где обыденное понятие «лёд» оказывается куда менее чётким, чем кажется неспециалисту.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_iii", "cards": ["cis-formatsiya", "gauche-formatsiya", "troposfernoe-samodovolstvo", "nataniel-gotorn", "klatratgidrat", "osyol-silvestr"]}, {"id": "chapter_2_iv", "chapter": 2, "section": "iv", "title": "Инструменты и задачи", "annotation": "Уилсон критикует морализирующего оппонента Дарвина, который ошибочно полагает, что музыкальная восприимчивость — это просто вопрос внимания и тренировки, игнорируя психологические и культурные различия в инструментарии слушателя; эта ошибка коренится либо в объективистской (как у Фладда и Ньютона), либо в субъективистской (как у Рончи) модели музыкальных атрибутов, ни одна из которых не адекватна.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_iv", "cards": ["edward-lippmann", "frank-jackson", "fritz-winckel", "giuseppe-tartini", "john-dewey", "paul-hindemith", "robert-fludd", "vasco-ronchi", "w-a-sorge", "wolfgang-hildesheimer"]}, {"id": "chapter_2_v", "chapter": 2, "section": "v", "title": "Субъективный экстремизм", "annotation": "На примере Джеффа Тодда Титона и его апелляции к «музыкальному бытию» и пост-структуралистской критике объективности Уилсон прослеживает, как безобидный субъективизм смыкается с более радикальным семантическим холизмом. В результате такой смычки даже нейтральный термин «народная песня» начинает восприниматься как политически предосудительный акт. Автор заключает, что корень зла скрыт в непродуманных ur-философских допущениях о природе концепций и атрибутов, которые аналитическая философия вовремя не помогла им разрешить.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_v", "cards": ["participatory-idealism", "semantic-holism", "david-whisnant", "frank-and-anne-warner", "jeff-todd-titon", "thomas-reid", "tim-erikson", "timothy-cooley"]}, {"id": "chapter_2_vi", "chapter": 2, "section": "vi", "title": "Амфиболические грёзы", "annotation": "Уилсон рассматривает амфиболизм (способность амфибий жить в двух средах) как альтернативу классическим формам корреляции концепций и мира: понятия неизбежно включают конструктивный вклад познающего субъекта. Прослеживая эту линию от Канта через Бозанкета и романтиков до современных философов языка, автор показывает, как плодотворная критика наивного объективизма впоследствии может превращаться в радикальный субъективизм и холизм.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_vi", "cards": ["amphibolic-dreams", "amphibolism", "alfred-north-whitehead", "bernard-bosanquet", "bertrand-russell", "coleridge", "f-t-vischer", "giuseppe-tartini", "immanuel-kant", "joseph-addison", "l-susan-stebbing", "m-h-abrams", "r-southey", "t-h-huxley", "william-wordsworth", "lake-poets"]}, {"id": "chapter_2_vii", "chapter": 2, "section": "vii", "title": "Сезонность в концептуальной оценке", "annotation": "Уилсон подытоживает главу: беспокойство о «тропосферном самодовольстве» провело нас от объективистской трактовки концептуального содержания к субъективистской (через историю с Симфонией соль минор Моцарта). Далее автор анонсирует главный диагноз, с которым он буде бороться — нашу склонность игнорировать «сезонность», естественно присущую повседневным инструментам концептуальной оценки: факторы, которые в «первый день» кажутся критическими для поведения предиката, а во «второй» отбрасываются. Семантическая фиксированность склеивает разнородные направленности в фиктивное однородное «содержание». Распознать эти факторы, подчёркивает Уилсон, можно в ходе терпеливого и всеохватного научного исследованя.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_2/chapter_2_vii", "cards": ["participatory-idealism", "troposfernoe-samodovolstvo", "amok", "uellsovskaya-pishcha-bogov"]}, {"id": "chapter_3_i", "chapter": 3, "section": "i", "title": "Под спасительным крылышком предикатов", "annotation": "Уилсон объясняет путаницу из предыдущей главы тем, что мы ожидаем от «концепций» непосильной оценочной нагрузки, а когда подходящий субстрат для признака не находится, начинаем безуспешно искать ему новое пристанище — в ментальности, в амфиболии и т.д. Он связывает эту перегрузку с давней берклианской подозрительностью к абстрактным сущностям. Общие предикаты («есть кролик») создают иллюзию, что за ними стоит самостоятельная концепция, хотя на деле это лишь заимствованная у предикатов псевдо-субстанциальность. Сам Уилсон дистанцируется от анти-концептуализма Беркли и Куайна, настаивая, что многие атрибуты — надёжные компоненты физического мира, и обещает исследовать эту тему через призму обыденных классификационных предикатов.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_3/chapter_3_i", "cards": ["deflyatsionizm", "kontseptualnaya-peregruzka", "obshchie-imena", "staraya-shkola-obydennogo-yazyka", "dolgonosik-iz-ballady", "empty-form", "george-berkeley", "isaac-hawkins-browne", "j-l-austin", "joseph-addison", "willard-quine", "raki-i-somy"]}, {"id": "chapter_3_ii", "chapter": 3, "section": "ii", "title": "Классическое склеивание", "annotation": "Уилсон описывает классическую картину Рассела: концепция существует «в двух мирах» — мы её постигаем умом и одновременно она проявляется в мире вещей, и это двоемирие «склеивает» слово с реальностью. С одной стороны Уилсон согласен с куайновской или дьюивской критикой этого подхода. С другой стороны он защищает Рассела от обвинения в \"магизме\". Уилсон полагает ,что классическое склеивание надо отличать от других концепций, где слова наделяются смыслом через усилие воли говорящего (Оккам, ранний Витгенштейн).", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_3/chapter_3_ii", "cards": ["intentsionalno-obosnovannaya-predikatnaya-znachimost", "klassicheskoe-skleivanie", "problemy-filosofii-1912", "teoriya-deskriptsy", "gottlob-frege", "john-dewey", "ludwig-wittgenstein", "uilyam-okkam", "willard-quine", "bitva-pri-eyname", "etimologii-svyatogo-isidora", "logiko-filosofsky-traktat"]}, {"id": "chapter_3_iii", "chapter": 3, "section": "iii", "title": "Концептуальные направленности", "annotation": "Уилсон показывает на примере Рассела («находиться в» опирается на универсалию «быть локализованным в»), как классическая картина находит для каждого предиката концептуальное содержание. Это содержание должно служить инвариантным ядром, которое заранее решает все вопросы о правильном употреблении слова (его «направленности»), и это обещает философии роль надзирателя над понятиями, а науке защиту от неприятных сюрпризов. Уилсон же считает, что такая картина лишь схема, а реальные предикаты её не оправдывают: убедительной она кажется только потому, что мы не замечаем «сезонности» наших повседневных оценок, когда на один и тот же вопрос отвечаем по-разному в разные дни.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_3/chapter_3_iii", "cards": ["chuvstvitelnost-k-kontekstu", "metafora-dvortsa-rassela", "metafora-verstaka-rassela", "bertrand-russell", "michael-dummett"]}, {"id": "chapter_3_iv", "chapter": 3, "section": "iv", "title": "Блюстители концептуальной сферы", "annotation": "Уилсон признаёт, что здание Рассела красиво и что совет «сначала определим термины» иногда помогает (в отличие от крайностей Титона, считавшего его риторической агрессией). Но человеческие возможности по ограничению предикатов ограничены. Попытки поставить язык на надёжные рельсы приводят к «концептуальной перегрузке»: стоит обставить дворец мебелью, как в другом месте начинают трещать стены. Он упрекает и анти-классиков (последователей Витгенштейна с «коммунальными стандартами», Куайна, Фодора с его примерами вроде «собаки» и «дверной ручки») в том, что они сохраняют классический методологический оптимизм, хотя отвергают онтологию Рассела. Рассел, по Уилсону, остаётся лучшим образцом классицизма, потому что писал с оглядкой на практические кризисы физики и математики, о которых его последователи забыли.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_3/chapter_3_iv", "cards": ["genericheskie-primery", "kontseptualnaya-peregruzka", "metafora-dvortsa-rassela", "alfred-tennison", "dzherri-fodor", "godfri-kharold-khardi", "jeff-todd-titon", "nils-abel", "ogyusten-koshi", "problema-raskhodyashchikhsya-ryadov"]}, {"id": "chapter_3_v", "chapter": 3, "section": "v", "title": "Блуждающее значение", "annotation": "Уилсон объясняет свой взгляд на развитие значений слов через детскую книжку про игрушечный буксир Скаффи, которого течение уносит из ванны в бурную реку. Так же и слова в основном движут внешние, меняющиеся «течения» практики, а наши сознательные усилия по самоопределению играют лишь скромную роль. Уилсон сближается с Куайном в эволюционной картине языка (корабль Нойрата), но упрекает его в классической вере, что слова совершенствуются по общим методологическим максимам.", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_3/chapter_3_v", "cards": ["blujdayushee-kachestvo", "kontseptualnaya-peregruzka", "buksir-skaffi", "korabl-noyrata", "morskie-i-rechnye-metafory", "cary-grant", "oliver-heaviside", "otto-neurath", "willard-quine"]}, {"id": "chapter_3_vi", "chapter": 3, "section": "vi", "title": "Перегруженные содержания", "annotation": "Классическая картина предполагает, что за меняющимися и порой противоречивыми «направленностями» предиката стоит устойчивое ядро содержания. Уилсон показывает, что это не так, на трёх примерах: «есть красный», «есть зубчатое колесо» и «есть твёрдый». О каждом идут давние споры, и стороны тянут ядро в разные стороны: Мах и Локк против Хелен Келлер, Бойль и Декарт против Юма, Декарт против Рида. Одни делают ядром классификацию по ощущению, другие — инференциальные связи, третьи — внешний физический признак. Для Уилсона эти споры — симптомы концептуальной перегрузки: такие направленности естественно сменяют друг друга на разных этапах «карьеры» слова, и определяет их не наш «руль», а русло реки, как в истории буксиром Скаффи (гл. 3, §(vi), с. 158–169).", "url": "https://kagort.github.io/wand_sign_navigator/05-chapters/razdely/chapter_3/chapter_3_vi", "cards": ["inferentsialnaya-napravlennost", "kontseptualnaya-peregruzka", "yadro-kontseptualnogo-soderzhaniya", "buksir-skaffi", "buster-keaton", "david-hume", "ernst-mach", "helen-keller", "isaac-newton", "pierre-duhem", "rene-descartes", "robert-boyle", "thomas-reid"]}], "cards": {"amphibolic-dreams": {"title": "Амфиболические грёзы", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/amphibolic-dreams", "portrait": null}, "amphibolism": {"title": "Амфиболизм", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/amphibolism", "portrait": null}, "blujdayushee-kachestvo": {"title": "«Блуждающее значение» (метафора буксира Скаффи)", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/blujdayushee-kachestvo", "portrait": null}, "chuvstvitelnost-k-kontekstu": {"title": "Чувствительность к контексту", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/chuvstvitelnost-k-kontekstu", "portrait": null}, "cis-formatsiya": {"title": "Cis-формация", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/cis-formatsiya", "portrait": null}, "deflyatsionizm": {"title": "Дефляционизм (об абстрактных сущностях)", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/deflyatsionizm", "portrait": null}, "gauche-formatsiya": {"title": "Gauche-формация (гош-конформация)", "kind": "концепт", "url": "https://kagort.github.io/wand_sign_navigator/01-concepts/gauche-formatsiya", "portrait": null}, "generiche и и сомы (crayfish / catfish)", "kind": "пример-кейс", "url": "https://kagort.github.io/wand_sign_navigator/04-cases/raki-i-somy", "portrait": null}, "simfoniya-40-mozart": {"title": "Симфония №40 соль минор (Моцарт)", "kind": "пример-кейс", "url": "https://kagort.github.io/wand_sign_navigator/04-cases/simfoniya-40-mozart", "portrait": null}, "all-hat-no-cattle": {"title": "«All hat and no cattle» / «Big hat, no cattle»", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/all-hat-no-cattle", "portrait": null}, "alpiyskiy-kurort-komiksy": {"title": "Альпийский курорт в «комических романах»", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/alpiyskiy-kurort-komiksy", "portrait": null}, "bitva-pri-eyname": {"title": "Битва при Энтитеме (Antietam)", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/bitva-pri-eyname", "portrait": null}, "etimologii-svyatogo-isidora": {"title": "«Этимологии» святого Исидора", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/etimologii-svyatogo-isidora", "portrait": null}, "gete-arhetipy-vitgenshteyna": {"title": "Морфология растений Гёте и архетипы языковых игр Витгенштейна", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/gete-arhetipy-vitgenshteyna", "portrait": null}, "harvard-context": {"title": "Гарвард, 1970-е: контекст", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/harvard-context", "portrait": null}, "klatratgidrat": {"title": "Клатратгидрат (газогидрат)", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/klatratgidrat", "portrait": null}, "lake-poets": {"title": "Озёрная школа", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/lake-poets", "portrait": null}, "logiko-filosofsky-traktat": {"title": "«Логико-философский трактат»", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/logiko-filosofsky-traktat", "portrait": null}, "osyol-silvestr": {"title": "Осёл Сильвестр (из книги «Sylvester and the Magic Pebble»)", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/osyol-silvestr", "portrait": "https://kagort.github.io/wand_sign_navigator/06-context/assets/sylvestr.jpg"}, "religio-medici-tsitata": {"title": "«Religio Medici» и цитата Лэмба о Брауне", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/religio-medici-tsitata", "portrait": null}, "sense-and-sensibilia": {"title": "«Sense and Sensibilia» Дж. Л. Остина", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/sense-and-sensibilia", "portrait": null}, "skripichnaya-muzyka-vostochnogo-kentukki": {"title": "Скрипичная музыка Восточного Кентукки (собирательская практика Уилсона)", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/skripichnaya-muzyka-vostochnogo-kentukki", "portrait": null}, "teksasskaya-skripichnaya-muzyka": {"title": "Техасская скрипичная музыка (пример «жажды мажорных септаккордов»)", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/teksasskaya-skripichnaya-muzyka", "portrait": "https://kagort.github.io/wand_sign_navigator/06-context/assets/1901_fort_worth_fiddlers.jpeg"}, "uilson-fiddle-music": {"title": "Уилсон и старинная скрипичная традиция: реальный биографический контекст", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/uilson-fiddle-music", "portrait": null}, "untamed-women": {"title": "«Неукротимые женщины» (Untamed Women, 1952)", "kind": "контекст", "url": "https://kagort.github.io/wand_sign_navigator/06-context/untamed-women", "portrait": "https://kagort.github.io/wand_sign_navigator/06-context/assets/un_wom.jpg"}}, "chapters": [{"n": 1, "title": "Глава 1. Широкий экран (стр. 21–82)", "short": "Глава 1. Широкий экран", "sections": 11}, {"n": 2, "title": "Глава 2. Потерянные струны (стр. 82–135)", "short": "Глава 2. Потерянные струны", "sections": 7}, {"n": 3, "title": "Глава 3. Классический клей (стр. 136–216)", "short": "Глава 3. Классический клей", "sections": 6}, {"n": 4, "title": "Глава 4. Теория фасадов", "short": "Глава 4. Теория фасадов", "sections": 0}, {"n": 5, "title": "Глава 5. Практический подход к делу", "short": "Глава 5. Практический подход к делу", "sections": 0}, {"n": 6, "title": "Глава 6. Добродетели расколотого мышления", "short": "Глава 6. Добродетели расколотого мышления", "sections": 0}]};
const KINDS = [['концепт','Понятия'],['метафора','Метафоры и образы'],['персоналия','Персоналии'],['пример-кейс','Примеры-кейсы'],['контекст','Контекст']];
const SVGNS = 'http://www.w3.org/2000/svg';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const color = ch => css('--c' + ch);
const stations = DATA.sections;
const here = stations.length - 1;
const chapters = DATA.chapters;

function el(tag, attrs, parent){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function wrap(text, max){
  const words = text.split(' '), lines = [''];
  for (const w of words){
    const cur = lines[lines.length-1];
    if ((cur + ' ' + w).trim().length > max && cur) lines.push(w); else lines[lines.length-1] = (cur + ' ' + w).trim();
  }
  if (lines.length > 2){ lines.length = 2; lines[1] = lines[1].replace(/\s*\S*$/, '') + '…'; }
  return lines;
}

function layout(width){
  const vertical = width < 720;
  if (vertical){
    const x = 34, step = 74, top = 40;
    return {vertical, w: width, h: top + step * stations.length + 90,
      pos: stations.map((s, i) => ({x, y: top + i * step, row: i}))};
  }
  const perRow = width < 1000 ? 5 : 6, padX = 150, rowH = 190, top = 110;
  const inner = Math.max(width, 900) - padX * 2;
  const dx = inner / (perRow - 1);
  const pos = stations.map((s, i) => {
    const row = Math.floor(i / perRow), k = i % perRow;
    const x = row % 2 === 0 ? padX + k * dx : padX + (perRow - 1 - k) * dx;
    return {x, y: top + row * rowH, row};
  });
  const rows = Math.ceil(stations.length / perRow);
  return {vertical, w: Math.max(width, 900), h: top + (rows - 1) * rowH + 110, pos, perRow, padX};
}

function draw(){
  const svg = document.getElementById('map');
  svg.innerHTML = '';
  const width = svg.parentElement.clientWidth - 32;
  const L = layout(width);
  svg.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
  const lines = el('g', {}, svg), ghosts = el('g', {}, svg), nodes = el('g', {}, svg);
  const r = 26;
  // перегоны
  for (let i = 0; i < stations.length - 1; i++){
    const a = L.pos[i], b = L.pos[i+1];
    let d;
    if (L.vertical || a.row === b.row) d = `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    else {
      const side = a.x > L.w / 2 ? 1 : -1, ex = a.x + side * (L.padX - 40);
      d = `M ${a.x} ${a.y} H ${ex - side*r} Q ${ex} ${a.y} ${ex} ${a.y + r} V ${b.y - r} Q ${ex} ${b.y} ${ex - side*r} ${b.y} H ${b.x}`;
    }
    el('path', {d, fill:'none', stroke: color(stations[i+1].chapter), 'stroke-width':10, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, lines);
  }
  // строящийся участок: главы без разделов
  const last = L.pos[here], todo = chapters.filter(c => !c.sections);
  if (todo.length){
    const label = 'гл. ' + todo[0].n + (todo.length > 1 ? '–' + todo[todo.length-1].n : '') + ' · строится';
    if (L.vertical){
      el('path', {d:`M ${last.x} ${last.y} V ${last.y + 70}`, fill:'none', stroke:css('--ghost'), 'stroke-width':6, 'stroke-linecap':'round', 'stroke-dasharray':'2 14'}, ghosts);
      const t = el('text', {class:'st-ghost', x:last.x + 26, y:last.y + 66}, ghosts); t.textContent = label;
    } else {
      const dir = (last.row % 2 === 0) ? 1 : -1;
      const x2 = Math.max(40, Math.min(L.w - 40, last.x + dir * 230));
      el('path', {d:`M ${last.x} ${last.y} H ${x2}`, fill:'none', stroke:css('--ghost'), 'stroke-width':6, 'stroke-linecap':'round', 'stroke-dasharray':'2 16'}, ghosts);
      const t = el('text', {class:'st-ghost', x:(last.x + x2) / 2, y:last.y - 22, 'text-anchor':'middle'}, ghosts); t.textContent = label;
    }
  }
  // станции
  stations.forEach((s, i) => {
    const p = L.pos[i], col = color(s.chapter);
    const first = i === 0 || stations[i-1].chapter !== s.chapter;
    const g = el('g', {class:'station', tabindex:0, role:'button', 'data-i':i,
      'aria-label': `${s.chapter ? 'Глава ' + s.chapter + ', раздел (' + s.section + ')' : 'Предисловие'}: ${s.title}. Карточек: ${s.cards.length}${i === here ? '. Вы здесь' : ''}`}, nodes);
    if (i === here){
      const pulse = el('circle', {cx:p.x, cy:p.y, r:13, fill:css('--c1'), opacity:.35}, g);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
        el('animate', {attributeName:'r', values:'13;26;13', dur:'2.2s', repeatCount:'indefinite'}, pulse);
        el('animate', {attributeName:'opacity', values:'.35;0;.35', dur:'2.2s', repeatCount:'indefinite'}, pulse);
      }
    }
    if (first) el('circle', {cx:p.x, cy:p.y, r:16, fill:css('--card'), stroke:col, 'stroke-width':3}, g);
    el('circle', {class:'core', cx:p.x, cy:p.y, r:10, fill:css('--card'), stroke:col, 'stroke-width':5}, g);
    if (i === here) el('circle', {cx:p.x, cy:p.y, r:4.5, fill:css('--c1')}, g);
    const num = !s.chapter ? 'ПРЕДИСЛОВИЕ' : (first && !L.vertical ? `ГЛАВА ${s.chapter} · (${s.section})` : `ГЛ. ${s.chapter} · (${s.section})`);
    const lines2 = s.chapter ? wrap(s.title, L.vertical ? 34 : 22) : [];
    if (L.vertical){
      const t0 = el('text', {class:'st-num', x:p.x + 30, y:p.y - 6}, g); t0.textContent = num + (i === here ? ' · ВЫ ЗДЕСЬ' : '');
      lines2.forEach((ln, k) => { const t = el('text', {class:'st-name', x:p.x + 30, y:p.y + 12 + k * 17}, g); t.textContent = ln; });
      if (first && s.chapter){ const c = el('text', {class:'ch-label', x:p.x + 30, y:p.y - 24, fill:col}, g); c.textContent = chapters[s.chapter - 1].short; }
    } else {
      const above = i % 2 === 0;
      const base = above ? p.y - 30 - (lines2.length - 1) * 17 : p.y + 36;
      lines2.forEach((ln, k) => { const t = el('text', {class:'st-name', x:p.x, y:base + k * 17, 'text-anchor':'middle'}, g); t.textContent = ln; });
      const ny = above ? base - 18 : base + lines2.length * 17 + (s.chapter ? 2 : 0);
      const t0 = el('text', {class:'st-num', x:p.x, y: s.chapter ? ny : p.y - 30, 'text-anchor':'middle'}, g);
      t0.textContent = num + (i === here ? ' · ВЫ ЗДЕСЬ' : '');
      if (first && s.chapter){ t0.setAttribute('fill', col); t0.style.fill = col; }
    }
    g.addEventListener('click', () => openStation(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openStation(i); } });
  });
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many);
}
function header(){
  const cards = new Set(stations.flatMap(s => s.cards));
  const h = stations[here];
  document.getElementById('header-note').innerHTML =
    `<b>${here} ${plural(here, 'станция', 'станции', 'станций')} позади</b><br>вы здесь — гл. ${h.chapter} (${h.section})<br>${cards.size} ${plural(cards.size, 'карточка', 'карточки', 'карточек')} на линии`;
  const lg = document.getElementById('legend');
  const items = [['0', 'Предисловие']].concat(chapters.filter(c => c.sections).map(c => [String(c.n), c.short]));
  lg.innerHTML = items.map(([n, t]) => `<div class="item"><span class="swatch" style="background:var(--c${n})"></span>${t}</div>`).join('') +
    '<div class="item"><span class="swatch dashed"></span>участок строится</div><div class="item"><span class="dot-here"></span>вы здесь</div>';
}

const panel = document.getElementById('panel'), backdrop = document.getElementById('backdrop');
let lastFocus = null;
function openStation(i){
  const s = stations[i];
  document.getElementById('panel-head').style.background = color(s.chapter);
  document.getElementById('panel-num').textContent = s.chapter ? `${chapters[s.chapter - 1].short} · раздел (${s.section})` : 'Предисловие';
  document.getElementById('panel-title').textContent = s.title;
  document.getElementById('panel-meta').textContent = `Карточек: ${s.cards.length}` + (i === here ? ' · вы здесь' : '');
  const body = document.getElementById('panel-body');
  body.innerHTML = '';
  for (const para of (s.annotation || '').split(/(?<=\.)\s+(?=[А-ЯA-Z«])/).reduce((acc, sent) => {
      if (!acc.length || acc[acc.length-1].length > 320) acc.push(sent); else acc[acc.length-1] += ' ' + sent; return acc; }, [])){
    const p = document.createElement('p'); p.textContent = para; body.appendChild(p);
  }
  const open = document.createElement('a'); open.className = 'open-page'; open.href = s.url; open.textContent = 'Открыть страницу раздела →';
  body.appendChild(open);
  const cards = s.cards.map(id => DATA.cards[id]).filter(Boolean);
  if (!cards.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Карточек пока нет.'; body.appendChild(e); }
  for (const [kind, label] of KINDS){
    const list = cards.filter(c => c.kind === kind).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    if (!list.length) continue;
    const g = document.createElement('div'); g.className = 'group';
    const h = document.createElement('h3'); h.textContent = `${label} · ${list.length}`; g.appendChild(h);
    const chips = document.createElement('div'); chips.className = 'chips';
    for (const c of list){
      const a = document.createElement('a'); a.className = 'chip' + (c.portrait ? '' : ' noimg'); a.href = c.url;
      if (c.portrait){ const im = document.createElement('img'); im.src = c.portrait; im.alt = ''; im.loading = 'lazy'; im.onerror = () => { im.remove(); a.classList.add('noimg'); }; a.appendChild(im); }
      a.appendChild(document.createTextNode(c.title)); chips.appendChild(a);
    }
    g.appendChild(chips); body.appendChild(g);
  }
  body.scrollTop = 0;
  lastFocus = document.activeElement;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); backdrop.classList.add('open');
  history.replaceState(null, '', '#' + s.id);
  document.getElementById('close-btn').focus();
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); backdrop.classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
  if (lastFocus) lastFocus.focus();
}
document.getElementById('close-btn').addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });

header(); draw();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
const fromHash = stations.findIndex(s => '#' + s.id === location.hash);
if (fromHash >= 0) openStation(fromHash);
</script>
