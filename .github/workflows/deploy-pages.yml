name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dataset and dashboards
        run: |
          pip install pyyaml openpyxl
          python scripts/build_dataset.py
          python scripts/build_dashboards.py

      - name: Build Quartz
        run: npx quartz build -d content

      - name: Redirect old dashboard addresses
        # дашборды теперь лежат в quartz/static/dash/ и попадают на сайт сами (/static/dash/…);
        # старые адреса /linia/ и /atlas/ перенаправляют туда, сохраняя #якорь
        run: |
          for d in linia atlas; do
            mkdir -p public/$d
            printf '<!doctype html><meta charset="utf-8"><title>…</title><script>location.replace("../static/dash/%s.html"+location.hash)</script><a href="../static/dash/%s.html">Перейти</a>\n' $d $d > public/$d/index.html
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4